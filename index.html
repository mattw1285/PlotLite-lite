<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    
    <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/mattw1285/PlotLite/main/assets/plotlite-logo.svg">
    
    <title>PlotLite</title>

    <link rel="stylesheet" 
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="anonymous"
    />

<style>  
:root {
    font-family: sans-serif;
    
    --pl-clr: #007e30;
    --pl-clr-second: #f0f7f2;
    --pl-background: #FFFFFF;
    --pl-logo: url('https://raw.githubusercontent.com/mattw1285/PlotLite/main/assets/plotlite-logo.svg');
    --pl-roundness: 8px;

    --header-height: 75px;
    --external-margin: 10px;
}

/* --- logo masks --- */
.github-logo{
    --github-logo: url('https://raw.githubusercontent.com/mattw1285/PlotLite/main/assets/github.svg');

    -webkit-mask: 
        var(--github-logo)
        no-repeat 
        center / contain
    ;
    mask: 
        var(--github-logo)
        no-repeat 
        center / contain
    ;
    
    stroke: var(--pl-clr);
    background-color: var(--pl-clr);

    width: 70%;
    height: 70%;

}

.plotlite-logo {
    -webkit-mask: 
        var(--pl-logo)
        no-repeat 
        center / contain
    ;
    mask: 
        var(--pl-logo)
        no-repeat 
        center / contain
    ;
    
    stroke: var(--pl-clr);
    background-color: var(--pl-clr);
}

.license-logo {
    --license-logo: url('https://raw.githubusercontent.com/mattw1285/PlotLite/main/assets/license.svg');

    -webkit-mask: 
        var(--license-logo)
        no-repeat 
        center / contain
    ;
    mask: 
        var(--license-logo)
        no-repeat 
        center / contain
    ;
    
    stroke: var(--pl-clr);
    background-color: var(--pl-clr);

    width: 70%;
    height: 70%;
}

.author-logo {
    --license-logo: url('https://raw.githubusercontent.com/mattw1285/PlotLite/main/assets/signature.svg');

    -webkit-mask: 
        var(--license-logo)
        no-repeat 
        center / contain
    ;
    mask: 
        var(--license-logo)
        no-repeat 
        center / contain
    ;
    
    stroke: var(--pl-clr);
    background-color: var(--pl-clr);

    width: 70%;
    height: 70%;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
}


/* --- header --- */
header {
    position: absolute;
    top: var(--external-margin);
    left: var(--external-margin);
    
    width: 1000px;
    max-width: 75%;

    height: var(--header-height);

    display: grid;
    grid-template-columns: auto 1fr;
    align-items: center;

    padding: 0 20px;

    background-color: #FFFFFF;
    border-radius: var(--pl-roundness);

    box-shadow: 0 4px 4px rgba(0, 0, 0, 0.25);

    z-index: 1000;
}

header h1 {
    grid-column: 1;
    display: flex;
    align-items: left;
    gap: 10px;

    margin: 0;

    font-size: 2rem;
    color: var(--pl-clr);
}

header aside {
    grid-column: 2;
    display: flex;
    align-items: right;
}

header aside a {
    --tile-size: 50px;

    display: flex;
    justify-content: center;
    align-items: center;

    width: var(--tile-size);
    height: var(--tile-size);

    background-color: var(--pl-background);
    border-radius: var(--pl-roundness);
    box-sizing: border-box;

    text-decoration: none;
    color: var(--pl-clr);
    font-size: var(--tile-size);--tile-size: 50px;

    display: flex;
    justify-content: center;
    align-items: center;

    width: var(--tile-size);
    height: var(--tile-size);

    text-decoration: none;
    color: var(--pl-clr);
    font-size: var(--tile-size);
}

header aside a:hover {
    background-color: var(--pl-clr-second);
}


#map {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 0;
}

#header-logo {
    --logo-multiplier: 0.75;

    width: calc(var(--logo-multiplier) * var(--header-height));
    height: calc(var(--logo-multiplier) * var(--header-height));
}
</style>
</head>

<body>
    <header id="header">
        <h1>
            <div class="plotlite-logo" id="header-logo"></div>
            PlotLite-lite
        </h1>

        <aside><nav>
            <a href="https://github.com/mattw1285/PlotLite-lite" 
                target="_blank"  
                rel="noopener noreferrer"
                id="gh-link"
                class="link-tile"
            >
                <div class="github-logo"></div>
            </a>

            <a href="./LICENSE.md" 
                rel="noopener noreferrer"
                class="link-tile"
                id="license-link"
            >
                <div class="license-logo"></div>
            </a>

            <a href="https://mattw1285.github.io/" 
                target="_blank" 
                rel="noopener noreferrer"
                class="link-tile"
                id="author-link"
            >
                <div class="author-logo"></div>
            </a>
        </nav></aside>
    </header>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin="anonymous"
    ></script>

<script>      
const map = L.map(
    'map',
    {
        zoomControl: false,
        maxBounds: [
            [-85.05, -180],
            [85.05, 180]
        ],
        maxBoundsViscosity: 1.0
    }
).setView([54.9974, -1.457], 19);

L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom: 19,
        minZoom: 3,
        attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'     
    }
).addTo(map);

L.control.zoom({
    position: 'topright'
}).addTo(map);
</script>
</body>
</html>
