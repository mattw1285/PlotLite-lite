<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    
    <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/mattw1285/PlotLite/main/assets/plotlite-logo.svg">
    
    <title>PlotLite</title>

    <link rel="stylesheet" 
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="anonymous"
    />

<style>  
:root {
    font-family: sans-serif;
    --roundness: 8px;
    
    --plotlite-colors: #36c990;
    --plotlite-logo: url('https://raw.githubusercontent.com/mattw1285/PlotLite/main/assets/plotlite-logo.svg');
    --plotlite-background: #E0E0E0;

    --github-logo: url('https://raw.githubusercontent.com/mattw1285/PlotLite/main/assets/github.svg');

    --header-height: 70px;
    --external-margin: 10px;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    background-color: var(--default-background);
}

.github-logo{
    -webkit-mask: 
        var(--github-logo)
        no-repeat 
        center / contain
    ;
    mask: 
        var(--github-logo)
        no-repeat 
        center / contain
    ;
    
    stroke: var(--plotlite-colors);
    background-color: var(--plotlite-colors);

    width: 80%;
    height: 80%;

}

.plotlite-logo {
    -webkit-mask: 
        var(--plotlite-logo)
        no-repeat 
        center / contain
    ;
    mask: 
        var(--plotlite-logo)
        no-repeat 
        center / contain
    ;
    
    stroke: var(--plotlite-colors);
    background-color: var(--plotlite-colors);
}

header {

    position: absolute;
    top: var(--external-margin);
    left: var(--external-margin);
    right: var(--external-margin);

    height: var(--header-height);

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 20px;

    background-color: #FFFFFF;
    border-radius: var(--roundness);
    box-sizing: border-box;

    box-shadow: 0 4px 4px rgba(0, 0, 0, 0.25);

    z-index: 1000;
}

#gh-link{
    position: absolute;

    top: calc(var(--external-margin) + var(--header-height) + 10px);
    right: var(--external-margin);

    width: 50px;
    height: 50px;

    display: flex;
    justify-content: center;
    align-items: center;
    
    background: white;
    border-radius: var(--roundness);
    box-shadow: 0 4px 4px rgba(0, 0, 0, 0.25);

    z-index: 1000;
}

#map {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 0;
}

header a {
    display: flex;
    align-items: center;
    gap: 5px;

    text-decoration: none;
    color: #333;

    font-size: 0.95rem;
    font-weight: 500;
}

header h1 {
    display: flex;
    align-items: center;
    gap: 10px;

    margin: 0;

    font-size: 2rem;
    color: #36c990;
}

#map {
    flex: 1;
    min-height: 0;
    min-width: 0;
} 

#header-logo {
    --logo-multiplier: 0.75;

    width: calc(var(--logo-multiplier) * var(--header-height));
    height: calc(var(--logo-multiplier) * var(--header-height));
}
</style>
</head>

<body>
    <header id="header">
        <h1>
            <div class="plotlite-logo" id="header-logo"></div>
            PlotLite
        </h1>
        <a href="https://mattw1285.github.io/" target="_blank">&copy; mattw1285</a>    
    </header>

    <a href="https://github.com/mattw1285/PlotLite-lite" target="_blank" id="gh-link">
        <div class="github-logo"></div>
    </a>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin="anonymous">
    </script>

<script>      
const map = L.map(
    'map',
    {
        maxBounds: [
            [-85.05, -180],
            [85.05, 180]
        ],
        maxBoundsViscosity: 1.0
    }
).setView([54.9974, -1.457], 19);

L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom: 19,
        minZoom: 3,
        attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'     
    }
).addTo(map);
      
</script>
</body>
</html>
