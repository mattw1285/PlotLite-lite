<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    
    <link rel="icon" type="image/x-icon" href="./imgs/plotlite-logo.svg">
    
    <title>PlotLite</title>
<style>  
:root {
    font-family: sans-serif;
    --header-height: 70px;
    --default-background: #E0E0E0;
    --roundness: 8px;
    --external-margin: 10px;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    padding: var(--external-margin);
    gap: var(--external-margin);
    background-color: var(--default-background);
}

header {
    height: var(--header-height);
    flex-shrink: 0;
    
    display: flex;
    align-items: center;
    justify-content: space-between;
    
    padding: 0 20px;
    background-color: #FFFFFF;
    border-radius: var(--roundness);
    box-sizing: border-box;

    box-shadow: 0 4px 4px rgba(0, 0, 0, 0.25);
}

/* Left: GitHub Link */
header a {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: #333;
    font-size: 0.95rem;
    font-weight: 500;
}

header a img {
    width: 20px;
    height: 20px;
}

/* Center: Logo & Title */
header h1 {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0;
    font-size: 1.25rem;
    color: #111;
}

header h1 img {
    height: 36px; /* Explicit height prevents massive SVG blowouts */
    width: auto;
}

/* Right: Copyright */
header p {
    margin: 0;
    color: #666;
    font-size: 0.85rem;
}

#map {
    flex: 1;
    min-height: 0;
    min-width: 0;
    
    border-radius: var(--roundness);
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.25);
}

    <link rel="stylesheet" 
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="anonymous"
    />
</head>
<body>
    <header id="header">
        <a href="https://github.com/mattw1285/PlotLite-lite">
            <img src="./imgs/github.svg">
            <span>GitHub</span>
            
        </a>
        <h1>
            <img src="./imgs/plotlite-logo.svg"style="height: var(--header-height)">
            PlotLite
        </h1>
        <p>&copy; mattw1285</p>    
    </header>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin="anonymous">
    </script>

<script>      
const map = L.map(
    'map',
    {
        maxBounds: [
            [-85.05, -180],
            [85.05, 180]
        ],
        maxBoundsViscosity: 1.0
    }
).setView([54.5,-2.5],6);

L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom: 19,
        minZoom: 3,
        attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'     
    }
).addTo(map);
      
</script>
</body>
