<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    
    <img src="./plotlite-logo.svg">
    
    <title>PlotLite</title>
    
<style>  
:root {
    font-family: sans-serif;
    
    --header-height: 75px;
    --default-background: #E0E0E0;
    --roundness: 5px;
    --external-margin: 1%;
}

html, body{
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    display: flex;
    flex-direction: column;
    
    box-sizing: border-box;

    padding: var(--external-margin);
    gap: var(--external-margin);

    background-color:var(--default-background);
}

header {
    height: var(--header-height);
    flex-shrink: 0;
    
    display: flex;
    align-items: center;
    justify-content: space-between;
    
    padding: 0 20px;
    
    background-color: #FFFFFF;
    border-radius: var(--roundness);
}

#map {
    flex: 1;
    min-height: 0;
    min-width: 0;
    
    border-radius: var(--roundness);
}    
</style>
    
    <link rel="stylesheet" 
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="anonymous"
    />
</head>
<body>
    <header id="header">
        <a href="https://github.com/mattw1285/PlotLite-lite">
            <img src="./imgs/github.svg">
            <span>GitHub</span>
            
        </a>
        <img src="./imgs/plotlite-logo.svg">
        <h1>PlotLite</h1>
        <p>&copy; mattw1285</p>    
    </header>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin="anonymous">
    </script>

<script>      
const map = L.map(
    'map',
    {
        maxBounds: [
            [-85.05, -180],
            [85.05, 180]
        ],
        maxBoundsViscosity: 1.0
    }
).setView([54.5,-2.5],6);

L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom: 19,
        minZoom: 3,
        attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'     
    }
).addTo(map);
      
</script>
</body>
</html>
